# =============================================================================
# ecomerce-store — local development stack
#
#   docker compose up --build
#
# Boots Postgres, applies migrations, seeds (idempotent), then starts the app.
# See BLOCKERS.md BLK-002: Docker was unavailable where this was authored, so
# this file is not runtime-verified.
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: es_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U store -d store']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: es_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ['full', 'redis']

  # One-shot: apply migrations then seed. App waits for this to exit cleanly.
  migrate:
    build:
      context: .
      target: builder
    container_name: es_migrate
    environment:
      DATABASE_URL: postgresql://store:store@db:5432/store?schema=public
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma db seed"
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    container_name: es_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://store:store@db:5432/store?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_SECRET: local-dev-secret-change-me-0123456789abcdef
      GST_LEGAL_ENTITY_NAME: '[LEGAL_ENTITY_NAME]'
      GST_GSTIN: '[GSTIN]'
      GST_SELLER_STATE: Maharashtra
      GST_SELLER_STATE_CODE: '27'
      RAZORPAY_ENABLED: 'false'
      SHIPROCKET_ENABLED: 'false'
      EMAIL_ENABLED: 'false'
      STORAGE_DRIVER: local
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
